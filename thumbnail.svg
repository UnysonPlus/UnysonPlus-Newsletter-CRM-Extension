<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
	<!--
		Extension thumbnail. House convention (see template-library / chat /
		animation-engine): 256x256, NO background plate, monochrome #ffffff only —
		the Extensions manager paints the 128px tile behind it — and the glyph is
		centred and scaled to roughly half the tile so it sits at the same optical
		size as its siblings. Hence the outer translate/scale wrapper, matching
		animated-icons and animation-engine; stroke-width is set so it lands at
		~12px effective once scaled, like the rest of the family.

		An envelope with a contact badge on its corner: the newsletter form plus
		the person it now stores. The badge is masked OUT of the envelope so the
		two shapes stay legible at thumbnail size instead of merging.
	-->
	<mask id="fw-crm-badge-cutout">
		<rect x="0" y="0" width="256" height="256" fill="#ffffff"/>
		<circle cx="204" cy="70" r="40" fill="#000000"/>
	</mask>

	<g transform="translate(128,128) scale(0.68) translate(-131,-125)">
		<g mask="url(#fw-crm-badge-cutout)" fill="none" stroke="#ffffff" stroke-width="18"
		   stroke-linecap="round" stroke-linejoin="round">
			<rect x="40" y="84" width="150" height="112" rx="18"/>
			<path d="M40 100 L115 154 L190 100"/>
		</g>

		<g fill="#ffffff">
			<circle cx="204" cy="52" r="17"/>
			<path d="M182 94 a22 22 0 0 1 44 0 z"/>
		</g>
	</g>
</svg>
